name: Database integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: smartclinic_test
          MYSQL_USER: smartclinic_test
          MYSQL_PASSWORD: temporary-ci-only
          MYSQL_ROOT_PASSWORD: temporary-root-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - run: xvfb-run -a python -m unittest discover -s tests -v
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: smartclinic_test
          DB_PASSWORD: temporary-ci-only
          DB_NAME: smartclinic_test
          SMARTCLINIC_TEST_DATABASE: smartclinic_test
